spring.application.name=agencia
server.address=127.0.0.1
server.port=7001
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true
agencia.hsql.enabled=true
agencia.hsql.port=${AGENCIA_HSQL_PORT:9061}
# Prefixo dos arquivos do catálogo, dentro da pasta solicitada.
agencia.hsql.database-path=${AGENCIA_DB:/home/douglas/workspace/hsqldb/pessoal/agencia/agencia}
agencia.hsql.database-name=agencia
spring.datasource.url=jdbc:hsqldb:hsql://127.0.0.1:${agencia.hsql.port}/${agencia.hsql.database-name}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
joinfaces.faces.project-stage=Production
joinfaces.primefaces.theme=saga-blue

# Limites da importação de planilhas
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

joinfaces.faces.facelets-libraries=/WEB-INF/agencia.taglib.xml
