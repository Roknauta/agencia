<ui:composition xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                template="/layout/template.xhtml">

    <!--@elvariable id="crudController" type="com.roknauta.agencia.web.crud.CrudControllerBase"-->
    <ui:define name="conteudo">
        <h:panelGroup id="crudContent" layout="block">
            <h:form styleClass="crud-search" id="#{formId}SearchForm" rendered="#{!crudController.editing}">
                <p:outputPanel styleClass="crud-actions">
                    <p:commandButton id="novo" value="#{msg['novo']}" icon="pi pi-plus"
                                     action="#{crudController.novo}" process="@this"
                                     update=":crudContent" resetValues="true"/>
                </p:outputPanel>
                <p:panel header="#{msg['interface.pesquisa']}">
                    <p:panelGrid columns="2" layout="grid" styleClass="form-grid">
                        <ui:insert name="searchField"/>
                    </p:panelGrid>
                    <p:commandButton id="pesquisar" value="#{msg['interface.pesquisar']}" icon="pi pi-search"
                                     action="#{crudController.pesquisar}" process="@form" update=":crudContent"/>
                </p:panel>
                <p:spacer height="20"/>
                <ui:insert name="resultados"/>
            </h:form>
            <h:form id="#{formId}EditForm" styleClass="crud-form">
                <p:panel rendered="#{crudController.editing}" header="#{crudController.editForm.id!=null ? msg['crud.editando'] : msg['crud.cadastrando']} #{crudController.pageTitle()}">
                    <ui:insert name="editField"/>
                    <p:outputPanel styleClass="crud-footer">
                        <p:commandButton value="#{msg['salvar']}" icon="pi pi-save" action="#{crudController.save}" update=":crudContent" process="@form"
                                         id="salvar"/>
                        <p:commandButton id="cancelar" value="#{msg['cancelar']}" icon="pi pi-times"
                                         action="#{crudController.voltarPesquisa}" process="@this" update=":crudContent" resetValues="true"/>
                    </p:outputPanel>
                </p:panel>
            </h:form>
        </h:panelGroup>
    </ui:define>
</ui:composition>
