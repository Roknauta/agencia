<ui:component xmlns:ui="jakarta.faces.facelets" xmlns:cc="jakarta.faces.composite" xmlns:p="http://primefaces.org/ui">
    <cc:interface/>
    <cc:implementation>
        <p:confirmDialog global="true" responsive="true" appendTo="@(body)" styleClass="confirmacao-centralizada">
            <p:commandButton value="#{msg['voltar']}" type="button" styleClass="ui-confirmdialog-no"/>
            <p:commandButton value="#{msg['confirmar']}" type="button" styleClass="ui-confirmdialog-yes"/>
        </p:confirmDialog>
    </cc:implementation>
</ui:component>
