<ui:composition xmlns:ui="jakarta.faces.facelets" xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core" xmlns:m="jakarta.faces.composite/resources/components"
                xmlns:t="http://agencia.com/jsf">

    <p:fieldset legend="Pagamento">
    <p:panelGrid columns="2" layout="grid" styleClass="form-grid">
        <m:inputTextarea id="regrasAlteracao" label="#{msg['regras.alteracao']}"
                         value="#{servico.regrasAlteracao}" maxlength="3000" rows="3"/>
        <m:inputTextarea id="regrasCancelamento" label="#{msg['regras.cancelamento']}"
                         value="#{servico.regrasCancelamento}" maxlength="3000" rows="3"/>
        <m:inputTextarea id="observacoes" label="#{msg['observacoes']}"
                         value="#{servico.observacoes}" maxlength="3000" rows="4"/>
        <m:inputNumber id="valor" label="#{msg['valor']}" value="#{servico.valor}"
                       minValue="0" decimalPlaces="2"/>
        <m:inputNumber id="desconto" label="#{msg['desconto']}" value="#{servico.desconto}"
                       minValue="0" decimalPlaces="2"/>
        <m:selectOneMenu id="moeda" label="#{msg['moeda']}" value="#{servico.moeda}" required="true">
            <f:selectItems value="#{controller.moedas}" var="moeda"
                           itemValue="#{moeda}" itemLabel="#{moeda.descricao}"/>
        </m:selectOneMenu>
    </p:panelGrid>

    <!--<p:panelGrid columns="2" layout="grid" styleClass="form-grid">
        <m:inputNumber id="valor" label="#{msg['valor']}" value="#{servico.valor}"
                       minValue="0" decimalPlaces="2"/>
        <m:inputNumber id="desconto" label="#{msg['desconto']}" value="#{servico.desconto}"
                       minValue="0" decimalPlaces="2"/>
        <m:selectOneMenu id="moeda" label="#{msg['moeda']}" value="#{servico.moeda}" required="true">
            <f:selectItems value="#{controller.moedas}" var="moeda"
                           itemValue="#{moeda}" itemLabel="#{moeda.descricao}"/>
        </m:selectOneMenu>
    </p:panelGrid>-->

    <p:commandButton id="adicionarTaxa" value="#{msg['adicionar.taxa']}" icon="pi pi-plus"
                     action="#{controller.novaTaxa}" process="@this"
                     update=":taxaForm:taxaCampos" oncomplete="PF('taxaDialogWidget').show()"/>
    <p:dataTable id="taxasTabela" value="#{servico.taxas}" var="taxa" rowIndexVar="indiceTaxa"
                 emptyMessage="#{msg['nenhuma.taxa.adicionada']}" style="margin-top: 10px" showGridlines="true">
        <f:facet name="header">#{msg['taxas']}</f:facet>
        <p:column headerText="#{msg['interface.acoes']}" style="width: 85px">
            <p:commandButton icon="pi pi-pencil" title="#{msg['editar']}"
                             action="#{controller.editarTaxa(indiceTaxa)}" process="@this"
                             update=":taxaForm:taxaCampos" oncomplete="PF('taxaDialogWidget').show()"/>
            <p:commandButton icon="pi pi-trash" title="#{msg['excluir']}"
                             action="#{controller.removerTaxa(indiceTaxa)}" process="@this"
                             update="taxasTabela"/>
        </p:column>
        <t:column headerText="#{msg['tipo.taxa']}" value="#{taxa.tipoTaxa.nome}"/>
        <t:column headerText="#{msg['valor']}" value="#{taxa.moeda.simbolo} #{taxa.valor}"/>
    </p:dataTable>
    </p:fieldset>
</ui:composition>
