<ui:composition xmlns:ui="jakarta.faces.facelets" xmlns:m="jakarta.faces.composite/resources/components"
                xmlns:p="http://primefaces.org/ui" xmlns:t="http://agencia.com/jsf"
                xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" template="/layout/crud.xhtml">
    <ui:param name="crudController" value="#{eSimController}"/>
    <ui:param name="formId" value="eSim"/>
    <ui:define name="searchField">
        <m:autoComplete id="orcamentoPesquisa" label="#{msg['orcamento']}"
                        value="#{eSimController.orcamentoSelecionado}"
                        completeMethod="#{eSimController.completeOrcamento}"
                        var="orcamento" itemLabel="#{orcamento.autoCompleteLabel()}" itemValue="#{orcamento}"
                        converter="#{orcamentoConverter}" required="false" minQueryLength="0">
            <p:ajax event="itemSelect" listener="#{eSimController.selecionarOrcamento}"
                    process="@this" update=":crudContent"/>
        </m:autoComplete>
    </ui:define>
    <ui:define name="resultados">
        <m:crudDataTable>
            <p:column headerText="#{msg['interface.opcoes']}" styleClass="coluna-opcoes">
                <p:menuButton id="optionsESim" icon="pi pi-ellipsis-v" title="#{msg['interface.opcoes']}"
                              ariaLabel="#{msg['interface.opcoes']}" buttonStyleClass="ui-button-sm">
                    <p:menuitem id="editESim" value="#{msg['editar']}" icon="pi pi-pencil"
                                action="#{eSimController.editarESim(item.id)}" process="@this"
                                update=":crudContent" resetValues="true"/>
                    <p:menuitem id="removeESim" value="#{msg['excluir']}" icon="pi pi-trash"
                                action="#{eSimController.delete(item.id)}" process="@this" update=":crudContent">
                        <p:confirm header="#{msg['interface.excluir.registro']}"
                                   message="#{msg['interface.confirma.esta.acao']}"/>
                    </p:menuitem>
                </p:menuButton>
            </p:column>
            <t:column headerText="#{msg['operadora']}" value="#{item.operadora}"/>
            <t:column headerText="#{msg['plano']}" value="#{item.plano}"/>
            <t:column headerText="#{msg['franquia.dados']}" value="#{item.franquiaDados}"/>
            <t:column headerText="#{msg['duracao.dias']}" value="#{item.duracaoDias}"/>
            <t:column headerText="#{msg['quantidade']}" value="#{item.quantidade}"/>
            <t:column headerText="#{msg['valor.total']}" value="#{item.valorTotal}">
                <f:convertNumber type="currency" currencyCode="BRL" locale="pt_BR"/>
            </t:column>
        </m:crudDataTable>
    </ui:define>
    <ui:define name="editField">
        <p:panelGrid columns="3" layout="grid" styleClass="form-grid">
            <m:autoComplete id="orcamento" label="#{msg['orcamento']}"
                            value="#{eSimController.orcamentoSelecionado}"
                            completeMethod="#{eSimController.completeOrcamento}"
                            var="orcamento" itemLabel="#{orcamento.autoCompleteLabel()}" itemValue="#{orcamento}"
                            converter="#{orcamentoConverter}" required="true" minQueryLength="0">
                <p:ajax event="itemSelect" listener="#{eSimController.selecionarOrcamentoNoForm}" process="@this"/>
            </m:autoComplete>
            <m:inputText id="operadora" label="#{msg['operadora']}"
                         value="#{eSimController.editForm.operadora}" required="true" maxlength="200"/>
            <m:inputText id="plano" label="#{msg['plano']}"
                         value="#{eSimController.editForm.plano}" maxlength="200"/>
            <m:inputText id="franquiaDados" label="#{msg['franquia.dados']}"
                         value="#{eSimController.editForm.franquiaDados}" maxlength="200"/>
            <m:inputNumber id="duracaoDias" label="#{msg['duracao.dias']}"
                           value="#{eSimController.editForm.duracaoDias}" minValue="1" decimalPlaces="0"/>
            <m:inputNumber id="quantidade" label="#{msg['quantidade']}"
                           value="#{eSimController.editForm.quantidade}" minValue="1" decimalPlaces="0" required="true"/>
            <m:inputNumber id="valorTotal" label="#{msg['valor.total']}"
                           value="#{eSimController.editForm.valorTotal}" minValue="0" decimalPlaces="2"/>
        </p:panelGrid>
        <m:inputTextarea id="cobertura" label="#{msg['cobertura']}"
                         value="#{eSimController.editForm.cobertura}" rows="3"/>
        <m:inputTextarea id="instrucoes" label="#{msg['instrucoes.instalacao']}"
                         value="#{eSimController.editForm.instrucoesInstalacao}" rows="4"/>
        <p:panel header="#{msg['codigos.ativacao']}" styleClass="form-field">
            <p:commandButton id="adicionarCodigo" value="#{msg['adicionar.codigo']}" icon="pi pi-plus"
                             action="#{eSimController.adicionarCodigo}" process="@this" update="codigosTabela"/>
            <p:dataTable id="codigosTabela" value="#{eSimController.editForm.codigosAtivacao}" var="codigo"
                         rowIndexVar="indiceCodigo" emptyMessage="#{msg['nenhum.codigo.ativacao']}"
                         style="margin-top: 10px" showGridlines="true">
                <p:column headerText="#{msg['interface.acoes']}" style="width: 70px">
                    <p:commandButton action="#{eSimController.removerCodigo(indiceCodigo)}"
                                     process="@this" update="codigosTabela" icon="pi pi-trash"/>
                </p:column>
                <p:column headerText="#{msg['codigo.ativacao']}">
                    <p:inputText id="codigo" value="#{codigo}" maxlength="1000"/>
                </p:column>
            </p:dataTable>
        </p:panel>
    </ui:define>
</ui:composition>
