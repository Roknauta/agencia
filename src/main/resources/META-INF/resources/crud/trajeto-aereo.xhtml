<ui:composition xmlns:ui="jakarta.faces.facelets" xmlns:m="jakarta.faces.composite/resources/components"
                xmlns:p="http://primefaces.org/ui" xmlns:t="http://agencia.com/jsf"
                xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
                template="/layout/crud.xhtml">
    <ui:param name="crudController" value="#{trajetoAereoController}"/>
    <ui:param name="formId" value="trajetoAereo"/>
    <ui:define name="searchField">
        <m:autoComplete id="orcamentoPesquisa" label="#{msg['orcamento']}"
                        value="#{trajetoAereoController.orcamentoSelecionado}"
                        completeMethod="#{trajetoAereoController.completeOrcamento}"
                        var="orcamento" itemLabel="#{orcamento.numero} #{orcamento.cliente}" itemValue="#{orcamento}"
                        converter="#{orcamentoConverter}" required="true" minQueryLength="0">
            <p:ajax event="itemSelect" listener="#{trajetoAereoController.selecionarOrcamento}" process="@this" update=":crudContent"/>
        </m:autoComplete>
    </ui:define>
    <ui:define name="resultados">
        <m:crudDataTable>
            <t:column headerText="#{msg['sentido']}" value="#{item.sentido}"/>
            <t:column headerText="#{msg['voos']}" value="#{item.trechos.size()}"/>
            <t:column headerText="#{msg['valor.total']}" value="#{item.moeda.simbolo} #{item.valorTotal}"/>
        </m:crudDataTable>
    </ui:define>
    <ui:define name="editField">
        <p:panelGrid columns="3" layout="grid" styleClass="form-grid">
            <m:autoComplete id="orcamento" label="#{msg['orcamento']}" value="#{trajetoAereoController.orcamentoSelecionado}"
                            completeMethod="#{trajetoAereoController.completeOrcamento}" var="orcamento"
                            itemLabel="#{orcamento.autoCompleteLabel()}" itemValue="#{orcamento}"
                            converter="#{orcamentoConverter}" required="true" minQueryLength="0">
                <p:ajax event="itemSelect" listener="#{trajetoAereoController.selecionarOrcamento}" process="@this" update=":trajetoAereoEditForm:adicionarVoo"/>
            </m:autoComplete>
            <m:selectOneMenu id="sentido" label="#{msg['sentido']}" value="#{trajetoAereoController.editForm.sentido}" required="true">
                <f:selectItem itemLabel="#{msg['selecione']}" noSelectionOption="true"/>
                <f:selectItems value="#{trajetoAereoController.sentidos}" var="sentido" itemValue="#{sentido}" itemLabel="#{sentido}"/>
                <p:ajax event="change" process="@this" update=":trajetoAereoEditForm:adicionarVoo"/>
            </m:selectOneMenu>
        </p:panelGrid>
        <p:commandButton id="adicionarVoo" value="#{msg['adicionar.voo']}" icon="pi pi-plus" action="#{trajetoAereoController.novoTrecho}"
                         process="@this" update=":trechoForm"
                         disabled="#{empty trajetoAereoController.idOrcamento or empty trajetoAereoController.editForm.sentido}"/>
        <p:dataTable id="trechos" value="#{trajetoAereoController.editForm.trechos}" var="trecho" emptyMessage="#{msg['nenhum.registro.encontrado']}"
                     style="margin-top: 10px" showGridlines="true">
            <p:column headerText="#{msg['interface.acoes']}" style="width: 85px">
                <p:commandButton action="#{trajetoAereoController.editarTrecho(trajetoAereoController.editForm.trechos.indexOf(trecho))}"
                                 process="@this" update=":trechoForm" oncomplete="PF('trechoDialogWidget').show()" icon="pi pi-pencil" style="margin-right: 3px"/>
                <p:commandButton action="#{trajetoAereoController.removerTrecho(trajetoAereoController.editForm.trechos.indexOf(trecho))}"
                                 process="@this" update="@form" icon="pi pi-trash"/>
            </p:column>
            <t:column headerText="#{msg['numero.voo']}" value="#{trecho.voo.numero}"/>
            <t:column headerText="#{msg['campo.origem']}" value="#{trecho.voo.origem.getCidadeAndIata()}"/>
            <t:column headerText="#{msg['campo.destino']}" value="#{trecho.voo.destino.getCidadeAndIata()}"/>
            <t:column headerText="#{msg['campo.partida']}" value="#{trecho.dataPartida}"
                      converter="localDateGridConverter"/>
            <t:column headerText="#{msg['campo.chegada']}" value="#{trecho.dataChegada}"
                      converter="localDateGridConverter"/>
        </p:dataTable>
        <ui:include src="/resources/components/servicoFields.xhtml">
            <ui:param name="servico" value="#{trajetoAereoController.editForm}"/>
            <ui:param name="controller" value="#{trajetoAereoController}"/>
        </ui:include>
    </ui:define>
    <ui:define name="contentDialogs">
        <ui:include src="servico-taxa-dialog.xhtml">
            <ui:param name="controller" value="#{trajetoAereoController}"/>
        </ui:include>
        <ui:include src="aereo/inclusao-voo.xhtml"/>
    </ui:define>
</ui:composition>
