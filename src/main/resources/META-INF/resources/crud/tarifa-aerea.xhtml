<ui:composition xmlns:ui="jakarta.faces.facelets" xmlns:m="jakarta.faces.composite/resources/components"
                xmlns:p="http://primefaces.org/ui" xmlns:t="http://agencia.com/jsf"
                template="/layout/crud.xhtml">
    <ui:param name="crudController" value="#{tarifaAereaController}"/>
    <ui:param name="formId" value="tarifaAerea"/>
    <ui:define name="searchField">
        <m:inputText id="nome" label="#{msg['campo.nome']}" value="#{tarifaAereaController.searchForm.nome}" maxlength="100"/>
        <m:autoComplete id="companhiaAerea" label="#{msg['companhia.aerea']}"
                        value="#{tarifaAereaController.searchForm.companhiaAerea}"
                        completeMethod="#{companhiaAereaController.completeCompanhiaAerea}"
                        var="companhia" itemLabel="#{companhia.nome}" itemValue="#{companhia}"
                        converter="#{companhiaAereaConverter}" required="false" minQueryLength="1"/>
        <m:datePicker id="dataReferencia" label="#{msg['data.referencia']}"
                      value="#{tarifaAereaController.searchForm.dataReferencia}"/>
    </ui:define>
    <ui:define name="resultados">
        <m:crudDataTable readOnly="true">
            <t:column headerText="#{msg['campo.nome']}" value="#{item.nome}" sortBy="#{item.nome}"/>
            <t:column headerText="#{msg['companhia.aerea']}" value="#{item.companhiaAerea.nome}" sortBy="#{item.companhiaAerea.nome}"/>
            <t:column headerText="#{msg['data.referencia']}" value="#{item.dataReferencia}"
                      sortBy="#{item.dataReferencia}" converter="localDateGridConverter"/>
        </m:crudDataTable>
    </ui:define>
    <ui:define name="editField">
        <p:panelGrid columns="2" layout="grid" styleClass="form-grid">
            <m:inputText id="nome" label="#{msg['campo.nome']}" value="#{tarifaAereaController.editForm.nome}" required="true" maxlength="100"/>
            <m:autoComplete id="companhiaAerea" label="#{msg['companhia.aerea']}"
                            value="#{tarifaAereaController.editForm.companhiaAerea}"
                            completeMethod="#{companhiaAereaController.completeCompanhiaAerea}"
                            var="companhia" itemLabel="#{companhia.nome}" itemValue="#{companhia}"
                            converter="#{companhiaAereaConverter}" required="true" minQueryLength="1"/>
            <m:datePicker id="dataReferencia" label="#{msg['data.referencia']}"
                          value="#{tarifaAereaController.editForm.dataReferencia}" required="true"/>
            <m:autoComplete id="bagagensInclusas" label="#{msg['bagagens.inclusas']}"
                            value="#{tarifaAereaController.editForm.bagagensInclusas}"
                            completeMethod="#{bagagemCompanhiaAereaController.completeBagagemCompanhiaAerea}"
                            var="bagagem" itemLabel="#{bagagem.companhiaAerea.nome} - #{bagagem.tipoBagagem.label} - #{bagagem.dataReferencia}"
                            itemValue="#{bagagem}" converter="#{bagagemCompanhiaAereaConverter}"
                            required="false" multiple="true" minQueryLength="1"/>
            <m:inputTextarea id="regraCancelamento" label="#{msg['regra.cancelamento']}"
                             value="#{tarifaAereaController.editForm.regraCancelamento}"
                             required="true" maxlength="10000" rows="5" autoResize="true"/>
            <m:inputTextarea id="regraAlteracao" label="#{msg['regra.alteracao']}"
                             value="#{tarifaAereaController.editForm.regraAlteracao}"
                             required="true" maxlength="10000" rows="5" autoResize="true"/>
            <m:inputTextarea id="outrasInformacoes" label="#{msg['outras.informacoes']}"
                             value="#{tarifaAereaController.editForm.outrasInformacoes}"
                             required="false" maxlength="10000" rows="5" autoResize="true"/>
        </p:panelGrid>
    </ui:define>
</ui:composition>
