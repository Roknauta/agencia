<ui:composition xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html"
                xmlns:m="jakarta.faces.composite/resources/components"
                xmlns:p="http://primefaces.org/ui" xmlns:f="jakarta.faces.core"
                xmlns:t="http://agencia.com/jsf"
                template="/layout/crud.xhtml">
    <ui:param name="crudController" value="#{orcamentoController}"/>
    <ui:param name="formId" value="orcamento"/>
    <ui:define name="searchField">
        <m:inputText id="cliente" label="#{msg['cliente']}" value="#{orcamentoController.searchForm.cliente}" maxlength="200"/>
        <m:autoComplete id="origem" label="#{msg['campo.origem']}"
                        value="#{orcamentoController.searchForm.origem}"
                        completeMethod="#{cidadeController.completeCidade}"
                        var="cidade" itemLabel="#{cidade.nome}" itemValue="#{cidade}"
                        converter="#{cidadeConverter}" required="false" minQueryLength="1"/>
        <m:inputText id="destino" label="#{msg['campo.destino']}" value="#{orcamentoController.searchForm.destino}" maxlength="200"/>
        <m:datePicker id="inicio" label="#{msg['inicio']}" value="#{orcamentoController.searchForm.inicio}"/>
        <m:datePicker id="fim" label="#{msg['fim']}" value="#{orcamentoController.searchForm.fim}"/>
    </ui:define>
    <ui:define name="resultados">
        <p:dataTable id="registros" rendered="#{orcamentoController.pesquisaRealizada}"
                     value="#{orcamentoController.result}" var="item" reflow="true" showGridlines="true"
                     emptyMessage="#{msg['nenhum.registro.encontrado']}">
            <p:column headerText="#{msg['interface.opcoes']}" styleClass="coluna-opcoes">
                <p:menuButton id="options" icon="pi pi-ellipsis-v" title="#{msg['interface.opcoes']}"
                              ariaLabel="#{msg['interface.opcoes']}" buttonStyleClass="ui-button-sm">
                    <p:menuitem id="edit" value="#{msg['editar']}" icon="pi pi-pencil"
                                action="#{orcamentoController.edit(item.id)}" process="@this"
                                update=":crudContent" resetValues="true"/>
                    <p:menuitem id="remove" value="#{msg['excluir']}" icon="pi pi-trash"
                                action="#{orcamentoController.delete(item.id)}" process="@this"
                                update=":crudContent">
                        <p:confirm header="#{msg['interface.excluir.registro']}"
                                   message="#{msg['interface.confirma.esta.acao']}"/>
                    </p:menuitem>
                    <p:menuitem id="gerarPdf" value="Gerar PDF" icon="pi pi-file-pdf"
                                action="#{orcamentoController.gerarPdf(item.id)}" ajax="false" process="@this"/>
                    <p:menuitem id="registrarEnvio" value="#{msg['orcamento.registrar.envio']}"
                                icon="pi pi-send" action="#{orcamentoController.registrarEnvio(item.id)}"
                                process="@this" update=":crudContent"
                                rendered="#{item.status.name() eq 'RASCUNHO'}"/>
                    <p:menuitem id="registrarInteresse" value="#{msg['orcamento.registrar.interesse']}"
                                icon="pi pi-check" action="#{orcamentoController.registrarInteresseCliente(item.id)}"
                                process="@this" update=":crudContent"
                                rendered="#{item.status.name() eq 'ENVIADO'}"/>
                </p:menuButton>
            </p:column>
            <p:column headerText="#{msg['cliente']}" sortBy="#{item.cliente}">
                <h:outputText value="#{item.cliente}"/>
            </p:column>
            <p:column headerText="#{msg['campo.status']}" sortBy="#{item.status}">
                <h:outputText value="#{item.status.descricao}"/>
            </p:column>
            <p:column headerText="#{msg['campo.origem']}" sortBy="#{item.origem.nome}">
                <h:outputText value="#{item.origem.nome}"/>
            </p:column>
            <p:column headerText="#{msg['campo.destino']}" sortBy="#{item.destino}">
                <h:outputText value="#{item.destino}"/>
            </p:column>
            <p:column headerText="#{msg['inicio']}" sortBy="#{item.inicio}">
                <h:outputText value="#{item.inicio}"/>
            </p:column>
            <p:column headerText="#{msg['fim']}" sortBy="#{item.fim}">
                <h:outputText value="#{item.fim}"/>
            </p:column>
        </p:dataTable>
    </ui:define>
    <ui:define name="editField">
        <p:panelGrid columns="2" layout="grid" styleClass="form-grid">
            <m:inputText id="cliente" label="#{msg['cliente']}" value="#{orcamentoController.editForm.cliente}" required="true" maxlength="200"/>
            <m:autoComplete id="origem" label="#{msg['campo.origem']}"
                            value="#{orcamentoController.editForm.origem}"
                            completeMethod="#{cidadeController.completeCidade}"
                            var="cidade" itemLabel="#{cidade.nome}" itemValue="#{cidade}"
                            converter="#{cidadeConverter}" required="true" minQueryLength="1"/>
            <m:inputText id="destino" label="#{msg['campo.destino']}" value="#{orcamentoController.editForm.destino}" required="true" maxlength="200"/>
            <m:datePicker id="inicio" label="#{msg['inicio']}" value="#{orcamentoController.editForm.inicio}" required="true"/>
            <m:datePicker id="fim" label="#{msg['fim']}" value="#{orcamentoController.editForm.fim}" required="true"/>
            <m:inputNumber id="adultos" label="#{msg['adultos']}" value="#{orcamentoController.editForm.adultos}" required="true" minValue="0"/>
            <m:inputNumber id="criancas" label="#{msg['criancas']}" value="#{orcamentoController.editForm.criancas}" required="true" minValue="0"/>
            <m:inputNumber id="bebes" label="#{msg['bebes']}" value="#{orcamentoController.editForm.bebes}" required="true" minValue="0"/>
            <m:inputNumber id="desconto" label="#{msg['desconto']}" value="#{orcamentoController.editForm.desconto}"
                           decimalPlaces="2" minValue="0"/>
            <m:inputTextarea id="pagamento" label="#{msg['pagamento']}"
                             value="#{orcamentoController.editForm.pagamento}" maxlength="3000"/>
            <m:inputTextarea id="observacoes" label="#{msg['observacoes']}"
                             value="#{orcamentoController.editForm.observacoes}" maxlength="3000"/>
        </p:panelGrid>
<!--        <p:panel header="#{msg['viajantes']}" styleClass="form-field">-->
            <p:commandButton id="novoViajante" value="#{msg['adicionar.viajante']}" icon="pi pi-plus"
                             action="#{orcamentoController.novoViajante}" process="@this"
                             update=":viajanteDialogForm:viajanteCampos"
                             oncomplete="PF('viajanteDialogWidget').show()"/>
            <p:dataTable id="viajantesTabela" value="#{orcamentoController.editForm.viajantes}" var="viajante"
                         rowIndexVar="indiceViajante" emptyMessage="#{msg['nenhum.registro.encontrado']}"
                         style="margin-top: 10px" showGridlines="true">
                <p:column headerText="#{msg['interface.acoes']}" style="width: 70px">
                    <p:commandButton action="#{orcamentoController.removerViajante(indiceViajante)}"
                                     process="@this" update="viajantesTabela" icon="pi pi-trash"/>
                </p:column>
                <t:column headerText="#{msg['viajante.nome']}" value="#{viajante.nome}"/>
                <t:column headerText="#{msg['tipo.documento']}" value="#{viajante.tipoDocumento}"/>
                <t:column headerText="#{msg['documento']}" value="#{viajante.documento}"/>
                <t:column headerText="#{msg['data.nascimento']}" value="#{viajante.dataNascimento}"
                          converter="localDateConverter"/>
            </p:dataTable>
<!--        </p:panel>-->
    </ui:define>
    <ui:define name="contentDialogs">
        <p:dialog id="viajanteDialog" widgetVar="viajanteDialogWidget" modal="true"
                  header="#{msg['adicionar.viajante']}" width="700">
            <h:form id="viajanteDialogForm">
                <p:panelGrid id="viajanteCampos" columns="2" layout="grid" styleClass="form-grid">
                    <m:inputText id="nomeViajante" label="#{msg['viajante.nome']}"
                                 value="#{orcamentoController.viajanteForm.nome}" required="true" maxlength="200"/>
                    <m:selectOneMenu id="tipoDocumentoViajante" label="#{msg['tipo.documento']}"
                                     value="#{orcamentoController.viajanteForm.tipoDocumento}">
                        <f:selectItem itemLabel="#{msg['selecione']}" noSelectionOption="true"/>
                        <f:selectItems value="#{orcamentoController.tiposDocumentoViajante}" var="tipo"
                                       itemValue="#{tipo}" itemLabel="#{tipo}"/>
                    </m:selectOneMenu>
                    <m:inputText id="documentoViajante" label="#{msg['documento']}"
                                 value="#{orcamentoController.viajanteForm.documento}" maxlength="50"/>
                    <m:datePicker id="nascimentoViajante" label="#{msg['data.nascimento']}"
                                  value="#{orcamentoController.viajanteForm.dataNascimento}"/>
                </p:panelGrid>
                <p:outputPanel styleClass="crud-footer">
                    <p:commandButton id="adicionarViajante" value="#{msg['adicionar.viajante']}"
                                     icon="pi pi-check" action="#{orcamentoController.adicionarViajante}"
                                     process="@form" update=":orcamentoEditForm:viajantesTabela"
                                     oncomplete="if (!args.validationFailed) PF('viajanteDialogWidget').hide()"/>
                    <p:commandButton value="#{msg['cancelar']}" type="button" icon="pi pi-times"
                                     onclick="PF('viajanteDialogWidget').hide()"/>
                </p:outputPanel>
            </h:form>
        </p:dialog>
    </ui:define>
</ui:composition>
